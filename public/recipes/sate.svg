<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgSate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgSate)"/>
  <!-- Plate -->
  <ellipse cx="200" cy="180" rx="140" ry="55" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="4"/>
  <!-- Banana leaf -->
  <ellipse cx="200" cy="177" rx="110" ry="38" fill="#16a34a"/>
  <!-- Peanut sauce base -->
  <ellipse cx="190" cy="175" rx="70" ry="22" fill="#78350f"/>
  <ellipse cx="190" cy="173" rx="55" ry="16" fill="#92400e"/>
  <!-- Sweet soy sauce swirls -->
  <path d="M150 172 Q190 180 230 170" stroke="#18181b" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Skewers (bamboo sticks) -->
  <line x1="80" y1="210" x2="310" y2="135" stroke="#d97706" stroke-width="5" stroke-linecap="round"/>
  <line x1="90" y1="225" x2="320" y2="150" stroke="#d97706" stroke-width="5" stroke-linecap="round"/>
  <line x1="100" y1="240" x2="330" y2="165" stroke="#d97706" stroke-width="5" stroke-linecap="round"/>
  <!-- Grilled meat pieces -->
  <ellipse cx="170" cy="180" rx="16" ry="12" fill="#3f1d0b"/>
  <ellipse cx="200" cy="170" rx="16" ry="12" fill="#451a03"/>
  <ellipse cx="230" cy="160" rx="16" ry="12" fill="#291206"/>
  <ellipse cx="260" cy="150" rx="16" ry="12" fill="#3f1d0b"/>
  <!-- Sliced shallots and chili -->
  <circle cx="160" cy="165" r="7" fill="#dc2626"/>
  <circle cx="215" cy="182" r="6" fill="#16a34a"/>
  <circle cx="140" cy="180" r="6" fill="#f43f5e"/>
</svg>
